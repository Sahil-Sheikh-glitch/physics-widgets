<!DOCTYPE html>
<html>
<head>
<title>Electric Field V2</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
margin:0;
padding:30px;
}

.card{
max-width:1000px;
height:550px;
margin:auto;
background:#222;
border-radius:20px;
position:relative;
overflow:hidden;
}

.title{
padding:25px;
font-size:40px;
font-weight:bold;
}

.charge{
width:120px;
height:120px;
background:#f3cb53;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
font-weight:bold;
color:#111;

position:absolute;
left:50%;
top:50%;

transform:translate(-50%,-50%);
}

.arrow{
position:absolute;
color:#f3cb53;
font-size:50px;
font-weight:bold;
}

.up{
top:90px;
left:50%;
transform:translateX(-50%);
}

.down{
bottom:90px;
left:50%;
transform:translateX(-50%);
}

.left{
left:120px;
top:50%;
transform:translateY(-50%);
}

.right{
right:120px;
top:50%;
transform:translateY(-50%);
}

</style>
</head>

<body>

<div class="card">

<div class="title">
E ∝ 1/r²
</div>
<div style="padding:0 25px 20px 25px;">

<label>
Charge Type:
</label>

<select id="polarity">

<option value="positive">
Positive
</option>

<option value="negative">
Negative
</option>

</select>

</div>
  
<div id="up" class="arrow up">↑</div>
<div id="down" class="arrow down">↓</div>
<div id="left" class="arrow left">←</div>
<div id="right" class="arrow right">→</div>

<div class="charge">
+
</div>

</div>

  <script>

const polarity =
document.getElementById("polarity");

const up =
document.getElementById("up");

const down =
document.getElementById("down");

const left =
document.getElementById("left");

const right =
document.getElementById("right");

const charge =
document.querySelector(".charge");

polarity.addEventListener(
"change",
()=>{

if(
polarity.value==="positive"
){

up.innerHTML="↑";
down.innerHTML="↓";
left.innerHTML="←";
right.innerHTML="→";

charge.innerHTML="+";

}
else{

up.innerHTML="↓";
down.innerHTML="↑";
left.innerHTML="→";
right.innerHTML="←";

charge.innerHTML="−";

}

});

</script>
</body>
</html>
