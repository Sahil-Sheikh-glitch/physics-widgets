<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Electric Field Visualizer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0f0f0f;
font-family:Arial, sans-serif;
color:white;
padding:25px;
}

.container{
max-width:1100px;
margin:auto;
background:#1e1e1e;
border-radius:22px;
overflow:hidden;
display:grid;
grid-template-columns:1fr 1fr;
}

.left{
padding:30px;
}

.right{
background:#232323;
position:relative;
height:520px;
display:flex;
justify-content:center;
align-items:center;
}

h1{
font-size:42px;
margin-bottom:30px;
font-weight:600;
}

.info{
margin-top:20px;
line-height:1.8;
color:#ddd;
}

label{
display:block;
margin-top:20px;
margin-bottom:8px;
}

input[type=range]{
width:100%;
}

.readout{
margin-top:25px;
padding:15px;
background:#111;
border-radius:12px;
}

.formula{
font-size:22px;
margin-bottom:10px;
}

.value{
font-size:30px;
font-weight:bold;
color:#f3cb53;
}

svg{
width:100%;
height:100%;
}

#source{
cursor:pointer;
}

</style>

</head>
<body>

<div class="container">

<div class="left">

<h1>E ∝ 1/r²</h1>

<div class="info">

<p>
Visualize how electric field strength changes with distance.
</p>

</div>

<label>
Distance (r):
<span id="distanceText">2</span> m
</label>

<input
type="range"
id="distance"
min="1"
max="10"
value="2"
step="0.1"
>

<label>
Source Charge:
<span id="chargeText">Positive</span>
</label>

<input
type="range"
id="charge"
min="-1"
max="1"
value="1"
step="2"
>

<div class="readout">

<div class="formula">
E = 1 / r²
</div>

<div id="strength" class="value">
0.25
</div>

</div>

</div>

<div class="right">

<svg viewBox="0 0 500 500">

<defs>

<marker
id="arrow"
viewBox="0 0 10 10"
refX="8"
refY="5"
markerWidth="6"
markerHeight="6"
orient="auto-start-reverse">

<path
d="M0,0 L10,5 L0,10 z"
fill="#f3cb53"/>

</marker>

</defs>

<g id="fieldLines"></g>

<circle
id="source"
cx="250"
cy="250"
r="35"
fill="#f3cb53"
/>

<text
id="chargeSymbol"
x="250"
y="262"
text-anchor="middle"
font-size="34"
fill="#111"
font-weight="bold">
+
</text>

<circle
id="testCharge"
cx="360"
cy="180"
r="15"
fill="#f3cb53"
/>

<text
x="360"
y="186"
text-anchor="middle"
font-size="18"
fill="#111">
+
</text>

</svg>

</div>

</div>

<script>

const fieldLines =
document.getElementById("fieldLines");

const chargeSlider =
document.getElementById("charge");

const distanceSlider =
document.getElementById("distance");

function buildField(isPositive){

fieldLines.innerHTML = "";

const directions = [

[0,-140],
[100,-100],
[140,0],
[100,100],
[0,140],
[-100,100],
[-140,0],
[-100,-100]

];

directions.forEach(dir=>{

let x = 250 + dir[0];
let y = 250 + dir[1];

let line = document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

if(isPositive){

line.setAttribute("x1",250);
line.setAttribute("y1",250);
line.setAttribute("x2",x);
line.setAttribute("y2",y);

}else{

line.setAttribute("x1",x);
line.setAttribute("y1",y);
line.setAttribute("x2",250);
line.setAttribute("y2",250);

}

line.setAttribute("stroke","#f3cb53");
line.setAttribute("stroke-width","3");
line.setAttribute("marker-end","url(#arrow)");

fieldLines.appendChild(line);

});

}

function update(){

const r =
parseFloat(distanceSlider.value);

const q =
parseInt(chargeSlider.value);

const E =
(1/(r*r)).toFixed(3);

document.getElementById(
"distanceText"
).innerText = r;

document.getElementById(
"strength"
).innerText = E;

const positive = q > 0;

document.getElementById(
"chargeText"
).innerText =
positive ? "Positive" : "Negative";

document.getElementById(
"chargeSymbol"
).textContent =
positive ? "+" : "−";

buildField(positive);

}

chargeSlider.addEventListener(
"input",
update
);

distanceSlider.addEventListener(
"input",
update
);

update();

</script>

</body>
</html>
