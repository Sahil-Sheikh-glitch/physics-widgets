<!DOCTYPE html>
<html>
<head>
<title>Electric Field V2</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
margin:0;
padding:30px;
}

.card{
max-width:1000px;
height:550px;
margin:auto;
background:#222;
border-radius:20px;
position:relative;
overflow:hidden;
}

.title{
padding:25px;
font-size:40px;
font-weight:bold;
}

.charge{
width:120px;
height:120px;
background:#f3cb53;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
font-weight:bold;
color:#111;

position:absolute;
left:50%;
top:50%;

transform:translate(-50%,-50%);
}

.arrow{
position:absolute;
color:#f3cb53;
font-size:50px;
font-weight:bold;
}

.up{
top:90px;
left:50%;
transform:translateX(-50%);
}

.down{
bottom:90px;
left:50%;
transform:translateX(-50%);
}

.left{
left:120px;
top:50%;
transform:translateY(-50%);
}

.right{
right:120px;
top:50%;
transform:translateY(-50%);
}

</style>
</head>

<body>

<div class="card">

<div class="title">
E ∝ 1/r²
</div>

<div class="arrow up">↑</div>
<div class="arrow down">↓</div>
<div class="arrow left">←</div>
<div class="arrow right">→</div>

<div class="charge">
+
</div>

</div>

</body>
</html>
