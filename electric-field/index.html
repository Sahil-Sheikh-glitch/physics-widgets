<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Electric Field</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
margin:0;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
background:#222;
border-radius:20px;
padding:20px;
}

.main{
display:flex;
gap:20px;
}

.left{
flex:1;
}

.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

svg{
width:350px;
height:350px;
}

circle{
fill:#f0c34a;
}

line{
stroke:#f0c34a;
stroke-width:3;
}

</style>
</head>

<body>

<div class="container">

<div class="main">

<div class="left">

<h2>E ∝ 1/r²</h2>

<p id="description">
Positive source: field points outward.
</p>

<p>
Strength:
<span id="strength">1</span>
</p>

<input
type="range"
min="-10"
max="10"
value="1"
id="charge"
style="width:100%;"
>

</div>

<div class="right">

<svg viewBox="0 0 400 400">

<circle cx="200" cy="200" r="35"/>

<line id="up" x1="200" y1="150" x2="200" y2="70"/>
<line id="down" x1="200" y1="250" x2="200" y2="330"/>

<line id="left" x1="150" y1="200" x2="70" y2="200"/>
<line id="right" x1="250" y1="200" x2="330" y2="200"/>

</svg>

</div>

</div>

</div>

<script>

const slider =
document.getElementById("charge");

function update(){

let q =
parseFloat(slider.value);

document
.getElementById("strength")
.innerText =
Math.abs(q);

if(q >= 0){

document
.getElementById("description")
.innerText =
"Positive source: field points outward.";

}
else{

document
.getElementById("description")
.innerText =
"Negative source: field points inward.";

}

}

slider.addEventListener(
"input",
update
);

update();

</script>

</body>
</html>
